name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh scripts/build_native.ps1 -Configuration Release -Platform x64